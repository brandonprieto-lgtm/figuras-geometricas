name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build src/Figuras.Core/Figuras.Core.csproj --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test tests/Figuras.Tests/Figuras.Tests.csproj --configuration Release --no-build